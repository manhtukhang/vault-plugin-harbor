version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - unused
  settings:
    misspell:
      locale: US
    nolintlint:
      allow-unused: false
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
        text: G101
    paths:
      - testdata

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/manhtukhang/vault-plugin-harbor
  exclusions:
    generated: lax
    paths:
      - testdata
